                          <span>GitHub</span>
                        </span>
                        <DynamicIcon name="arrow-up-right" className="w-3 h-3 text-slate-500" />
                      </a>

                      <a
                        href={candidateProfile.linkedin}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="flex items-center justify-between p-2.5 rounded bg-slate-900 border border-slate-800 hover:border-slate-700 text-xs font-mono text-slate-300 hover:text-white"
                      >
                        <span className="flex items-center gap-1.5">
                          <DynamicIcon name="linkedin" className="w-3.5 h-3.5" />
                          <span>LinkedIn</span>
                        </span>
                        <DynamicIcon name="arrow-up-right" className="w-3 h-3 text-slate-500" />
                      </a>
                    </div>
                  </div>

                </div>
              </div>

              <div className="lg:col-span-7">
                <div className="rounded-xl border border-slate-800/80 bg-[#0d121c]/70 backdrop-blur-sm p-6 sm:p-8">
                  <h3 className="text-sm font-mono font-semibold uppercase tracking-wider text-slate-300 mb-6 flex items-center gap-2">
                    <DynamicIcon name="message-square" className="w-4 h-4 text-sky-400" />
                    <span>Dispatch Formal Inquiry</span>
                  </h3>

                  <form onSubmit={handleSubmit} className="space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1.5">
                          Your Name / Recruiter <span className="text-sky-400">*</span>
                        </label>
                        <input
                          type="text"
                          required
                          value={formData.name}
                          onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                          placeholder="e.g. Sarah Jenkins"
                          className="w-full px-3 py-2 text-xs font-mono bg-slate-900/90 border border-slate-800 rounded text-slate-100 placeholder-slate-600 focus:outline-none focus:border-slate-600"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-mono text-slate-400 mb-1.5">
                          Organization / Company
                        </label>
                        <input
                          type="text"
                          value={formData.organization}
                          onChange={(e) => setFormData({ ...formData, organization: e.target.value })}
                          placeholder="e.g. Google, Microsoft, Startup"
                          className="w-full px-3 py-2 text-xs font-mono bg-slate-900/90 border border-slate-800 rounded text-slate-100 placeholder-slate-600 focus:outline-none focus:border-slate-600"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1.5">
                        Email Address <span className="text-sky-400">*</span>
                      </label>
                      <input
                        type="email"
                        required
                        value={formData.email}
                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                        placeholder="e.g. s.jenkins@company.com"
                        className="w-full px-3 py-2 text-xs font-mono bg-slate-900/90 border border-slate-800 rounded text-slate-100 placeholder-slate-600 focus:outline-none focus:border-slate-600"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1.5">
                        Inquiry Details &amp; Scope <span className="text-sky-400">*</span>
                      </label>
                      <textarea
                        required
                        rows="4"
                        value={formData.message}
                        onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                        placeholder="Outline role details, team engineering challenges, or technical project scope..."
                        className="w-full px-3 py-2 text-xs font-mono bg-slate-900/90 border border-slate-800 rounded text-slate-100 placeholder-slate-600 focus:outline-none focus:border-slate-600 resize-none"
                      ></textarea>
                    </div>

                    {formStatus === 'success' && (
                      <div className="p-3 rounded bg-emerald-950/40 border border-emerald-800/80 text-emerald-300 text-xs font-mono flex items-center gap-2">
                        <DynamicIcon name="check" className="w-4 h-4 text-emerald-400" />
                        <span>Inquiry logged successfully. Chavva Sainath Reddy will respond via email shortly.</span>
                      </div>
                    )}

                    <div className="pt-2 flex items-center justify-between">
                      <span className="text-[11px] font-mono text-slate-500">
                        Direct reply SLA: &lt; 24 business hours
                      </span>

                      <button
                        type="submit"
                        disabled={formStatus === 'submitting'}
                        className="inline-flex items-center gap-2 px-5 py-2.5 rounded bg-slate-200 hover:bg-white text-slate-950 font-mono text-xs font-semibold hover:shadow-md transition-all disabled:opacity-50"
                      >
                        <DynamicIcon name="send" className="w-3.5 h-3.5" />
                        <span>{formStatus === 'submitting' ? 'Transmitting...' : 'Submit Inquiry'}</span>
                      </button>
                    </div>
                  </form>
                </div>
              </div>

            </div>

          </div>
        </section>
      );
    }

    // --- COMPONENT: FOOTER ---
    function Footer() {
      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <footer className="border-t border-slate-800 bg-[#07090e] py-10 text-slate-500 text-xs font-mono">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row items-center justify-between gap-6">
              
              <div className="space-y-1 text-center md:text-left">
                <p className="text-slate-300 font-semibold tracking-wide">
                  CHAVVA SAINATH REDDY &copy; 2026
                </p>
                <p className="text-slate-500 text-[11px]">
                  Executive Portfolio • Software Development Engineer | Data Scientist &amp; ML Engineer
                </p>
              </div>

              <div className="flex items-center gap-2 px-3 py-1 rounded bg-slate-900 border border-slate-800 text-[11px] text-slate-400">
                <DynamicIcon name="git-branch" className="w-3 h-3 text-sky-400" />
                <span>branch: main</span>
                <span className="text-slate-600">|</span>
                <span className="text-emerald-400 flex items-center gap-1">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" />
                  STATIC_BUILD_VERIFIED
                </span>
              </div>

              <div className="flex items-center space-x-4">
                <button
                  onClick={scrollToTop}
                  className="inline-flex items-center gap-1.5 text-slate-400 hover:text-slate-100 transition-colors focus:outline-none"
                  aria-label="Back to top"
                >
                  <span>Back to top</span>
                  <DynamicIcon name="arrow-up" className="w-3.5 h-3.5" />
                </button>
              </div>

            </div>
          </div>
        </footer>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, []);

      return (
        <div className="min-h-screen bg-[#090a0f] text-slate-100 selection:bg-sky-500/20 selection:text-white font-sans antialiased">
          <Header />
          <main>
            <Hero />
            <MetricBar />
            <SkillsSection />
            <ProjectsSection />
            <ExperienceSection />
            <CertificationsSection />
            <ContactSection />
          </main>
          <Footer />
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
